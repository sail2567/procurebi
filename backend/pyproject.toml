[project]
name = "procurebi-backend"
version = "0.1.0"
description = "LLM procurement cost BI agent backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "reportlab>=4.2,<6",
    "redis>=5.0",
    "sqlglot>=25.0",
    "httpx>=0.27",
    "orjson>=3.10",
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
    "pyjwt>=2.9,<3",
    "bcrypt>=4.2,<6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
