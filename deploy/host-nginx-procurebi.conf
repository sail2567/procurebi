# 可选方案：保留服务器上已有的 nginx，仅把请求转发给容器。
# 适用场景：80 端口已被宿主 nginx 占用，且不想停掉它。
#
# 使用方法：
#   1. docker-compose.prod.yml 的 web.ports 改为 "127.0.0.1:8080:80"
#   2. 复制本文件到 /etc/nginx/sites-available/procurebi
#   3. ln -s /etc/nginx/sites-available/procurebi /etc/nginx/sites-enabled/procurebi
#   4. 删除或禁用默认站点（sites-enabled/default），避免它抢占 default_server
#   5. nginx -t && systemctl reload nginx

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 问数
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
